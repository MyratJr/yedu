syntax = "proto3";

package chat;

option go_package = "./chatpb";

service ChatService {
  rpc Chat(stream ChatRequest) returns (stream ChatResponse);
}

message Tariff {
  string id          = 1;
  string name        = 2;
  string description = 3;
}

message ChatRequest {
  string session_id               = 1;
  string user_id                  = 2;
  string text_input               = 3;
  repeated bytes audio_inputs     = 4;
  repeated bytes image_inputs     = 5;
  string language                 = 6;
  repeated string favorite_places = 7;
  repeated Tariff tariffs         = 8;
}

message ChatResponse {
  oneof payload {
    TextChunk  text_chunk  = 1;
    ErrorInfo  error       = 2;
    OrderDraft order_draft = 3;
  }
}

message TextChunk {
  string text     = 1;
  bool   is_final = 2;
}

message OrderDraft {
  repeated string route     = 1;
  string scheduled_datetime = 2;
  string tariff_id          = 4;
  int32  passenger_count    = 5;
}

message ErrorInfo {
  string code    = 1;
  string message = 2;
}